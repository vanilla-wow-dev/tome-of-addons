name: ci

on:
  push:
    branches:
      - master
  pull_request:

# Laufende Runs bei neuem Push auf denselben Branch abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx vue-tsc --noEmit

      # Schlägt fehl, wenn die Coverage-Schwellwerte (vitest.config.ts) unterschritten werden.
      - name: Test + Coverage-Gate (Vitest)
        run: npm run coverage

  # Der Tree-Hasher ist der Identitäts-Anker des gesamten Systems und hat keine
  # Tauri-Abhängigkeit — daher ein eigener, schneller Job ohne WebKit-Setup.
  # Windows ist zwingend: dort greifen die #[cfg(unix)]-Tests nicht, und der
  # Rest muss trotzdem kompilieren und bestehen.
  tree-hash:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: crates/tree-hash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates/tree-hash -> target"

      - name: Format check
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --all-targets -- -D warnings

      # Die Kreuzvalidierung gegen `git write-tree` braucht ein sauberes
      # Git-Environment: eine globale core.autocrlf-Einstellung des Runners
      # würde den Vergleich verfälschen. Auf Windows-Runnern ist autocrlf=true
      # der Default, daher explizit abschalten.
      - name: Neutralize global git config
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"

      - name: Test + Coverage-Gate (100%)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo llvm-cov --fail-under-lines 100 --fail-under-functions 100

      - name: Test
        if: matrix.platform == 'windows-latest'
        run: cargo test

  rust:
    strategy:
      fail-fast: false
      matrix:
        # Windows ist zwingend, damit der #[cfg(windows)]-Registry-Code
        # tatsächlich kompiliert und getestet wird; Ubuntu deckt den Rest ab.
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: matrix.platform == 'ubuntu-22.04'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # tauri::generate_context! bettet das Frontend (frontendDist=../dist) zur
      # Compile-Zeit ein — dist/ ist gitignored, daher hier bauen.
      - name: Build frontend (dist for generate_context)
        run: npm run build

      - name: Format check
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Ubuntu: Tests MIT 100%-Coverage-Gate (Lines + Functions).
      # Ausgeschlossen ist nur der headless nicht ausführbare Tauri-Entrypoint:
      #   main.rs (Prozessstart), lib.rs (run() + .run()-Event-Loop),
      #   commands.rs (#[tauri::command]-Wrapper, nur von der IPC-Runtime aufgerufen).
      # Die gesamte Logik (wow.rs, exe.rs) wird zu 100% erzwungen.
      - name: Test + Coverage-Gate (100%)
        if: matrix.platform == 'ubuntu-22.04'
        run: >
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml
          --ignore-filename-regex '(^|/)(main|lib|commands)\.rs$'
          --fail-under-lines 100 --fail-under-functions 100

      # Windows: nur Compile + Test, damit der #[cfg(windows)]-Registry-Code abgedeckt ist.
      - name: Test
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml
