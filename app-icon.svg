<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Tome of Addons — originäres App-Icon (eigene Arbeit, lizenzfrei).
       Stil an klassische WoW-Buch-Icons angelehnt (Leder + Messing + Edelstein,
       leichte 3/4-Perspektive, dunkle Vignette) — keine Blizzard-Grafik kopiert. -->
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#3a2a1e"/>
      <stop offset="100%" stop-color="#0f0a06"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c5436"/>
      <stop offset="55%" stop-color="#73371f"/>
      <stop offset="100%" stop-color="#4d2415"/>
    </linearGradient>
    <linearGradient id="spineLeather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b2a17"/>
      <stop offset="100%" stop-color="#3a1c10"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4d987"/>
      <stop offset="50%" stop-color="#cb9a3a"/>
      <stop offset="100%" stop-color="#8a6018"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1e7c9"/>
      <stop offset="100%" stop-color="#cab98f"/>
    </linearGradient>
    <linearGradient id="pagesTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6eed6"/>
      <stop offset="100%" stop-color="#d8c79c"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8df0e0"/>
      <stop offset="55%" stop-color="#2fae9f"/>
      <stop offset="100%" stop-color="#155f57"/>
    </radialGradient>
    <radialGradient id="sheen" cx="35%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
      <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed Hintergrund (keine runden Ecken — das macht das OS). -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Buchdicke: oberer Seitenrand (Blick leicht von oben). -->
  <polygon points="258,250 700,250 726,210 284,210" fill="url(#pagesTop)" stroke="#9c895f" stroke-width="4"/>
  <g stroke="#c3b187" stroke-width="4" opacity="0.7">
    <line x1="292" y1="216" x2="708" y2="216"/>
    <line x1="300" y1="224" x2="712" y2="224"/>
  </g>

  <!-- Buchdicke: rechter Seitenblock. -->
  <polygon points="700,250 700,838 726,798 726,210" fill="url(#pages)" stroke="#9c895f" stroke-width="4"/>
  <g stroke="#c3b187" stroke-width="4" opacity="0.7">
    <line x1="708" y1="258" x2="708" y2="828"/>
    <line x1="714" y1="244" x2="714" y2="814"/>
    <line x1="720" y1="230" x2="720" y2="800"/>
  </g>

  <!-- Lederdeckel (Frontfläche). -->
  <polygon points="258,250 700,250 700,838 258,838" fill="url(#leather)"/>
  <polygon points="258,250 700,250 700,838 258,838" fill="url(#sheen)"/>
  <polygon points="258,250 700,250 700,838 258,838" fill="none" stroke="#34170c" stroke-width="8"/>

  <!-- Buchrücken links mit erhabenen Bünden. -->
  <rect x="258" y="250" width="56" height="588" fill="url(#spineLeather)"/>
  <line x1="314" y1="250" x2="314" y2="838" stroke="#2c1409" stroke-width="6"/>
  <g fill="url(#brass)">
    <rect x="262" y="312" width="48" height="20" rx="6"/>
    <rect x="262" y="436" width="48" height="20" rx="6"/>
    <rect x="262" y="560" width="48" height="20" rx="6"/>
    <rect x="262" y="684" width="48" height="20" rx="6"/>
  </g>

  <!-- Messing-Eckbeschläge. -->
  <g fill="url(#brass)" stroke="#6e4d12" stroke-width="3">
    <path d="M336 258 h70 v20 h-50 v44 h-20 z"/>
    <path d="M692 258 h-70 v20 h50 v44 h20 z"/>
    <path d="M336 830 h70 v-20 h-50 v-44 h-20 z"/>
    <path d="M692 830 h-70 v-20 h50 v44 h20 z"/>
  </g>

  <!-- Zentraler Beschlag mit Edelstein. -->
  <circle cx="486" cy="544" r="92" fill="url(#brass)" stroke="#6e4d12" stroke-width="4"/>
  <g fill="url(#brass)" stroke="#6e4d12" stroke-width="3">
    <path d="M486 432 l16 26 h-32 z"/>
    <path d="M486 656 l16 -26 h-32 z"/>
    <path d="M374 544 l26 16 v-32 z"/>
    <path d="M598 544 l-26 16 v-32 z"/>
  </g>
  <circle cx="486" cy="544" r="60" fill="url(#gem)" stroke="#0f4a44" stroke-width="6"/>
  <ellipse cx="470" cy="524" rx="20" ry="13" fill="#ffffff" opacity="0.45"/>

  <!-- Schließen (Riemen rechts). -->
  <g fill="url(#brass)" stroke="#6e4d12" stroke-width="3">
    <rect x="664" y="392" width="78" height="40" rx="8"/>
    <rect x="664" y="656" width="78" height="40" rx="8"/>
  </g>

  <!-- Dunkle Vignette (WoW-Rahmen-Anmutung). -->
  <rect width="1024" height="1024" fill="url(#vignette)"/>
</svg>
