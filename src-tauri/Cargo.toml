[package]
name = "tome-of-addons"
version = "0.1.0"
description = "Tome of Addons - WoW 1.12.1 addon manager"
authors = ["Ulf Gebhardt"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tome_of_addons_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# `_lib` suffix avoids name collision with the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

